{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Технические работы | DocFlow</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f6f8; color: #16212b; font-family: Arial, sans-serif; }
        main { width: min(100%, 600px); text-align: center; }
        img { width: 76px; height: 76px; object-fit: contain; }
        .status { display: inline-block; margin: 24px 0 12px; padding: 6px 10px; border-radius: 4px; background: #fff3e8; color: #c95700; font-weight: 700; }
        h1 { margin: 0 0 14px; font-size: 30px; }
        p { margin: 0 auto 12px; max-width: 480px; color: #5f6b76; line-height: 1.55; }
        small { display: block; margin-top: 24px; color: #87919b; }
    </style>
</head>
<body>
    <main>
        <img src="{% static 'img/company-logo.png' %}" alt="Сервис-Инжиниринг">
        <div><span class="status">Технические работы</span></div>
        <h1>DocFlow временно недоступен</h1>
        <p>Мы выполняем обслуживание системы. Пожалуйста, повторите попытку через несколько минут.</p>
        <small>Все сохранённые документы и маршруты согласования останутся без изменений.</small>
    </main>
</body>
</html>
