{% extends "base.html" %}
{% load static %}

{% block title %}Новый пароль | DocFlow{% endblock %}

{% block content %}
<section class="auth-panel">
    <div class="company auth-brand">
        <span class="company-logo">
            <img src="{% static 'img/company-logo.png' %}" alt="Сервис Инжиниринг">
        </span>
        <span class="company-text">
            <strong>Сервис Инжиниринг</strong>
            <small></small>
        </span>
    </div>
    <h1>Новый пароль</h1>
    <p class="auth-hint">Введите логин, код от администратора и новый пароль.</p>
    <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="primary" type="submit">Изменить пароль</button>
    </form>
    <div class="auth-links">
        <a href="{% url 'documents:password_reset_request' %}">Запросить новый код</a>
        <a href="{% url 'login' %}">Вернуться ко входу</a>
    </div>
</section>
{% endblock %}
