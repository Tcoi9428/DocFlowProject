{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Страница не найдена | DocFlow</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f6f8; color: #16212b; font-family: Arial, sans-serif; }
        main { width: min(100%, 560px); text-align: center; }
        img { width: 72px; height: 72px; object-fit: contain; }
        .code { margin: 24px 0 8px; color: #f58220; font-size: 64px; font-weight: 700; line-height: 1; }
        h1 { margin: 0 0 12px; font-size: 28px; }
        p { margin: 0 auto 24px; max-width: 440px; color: #5f6b76; line-height: 1.55; }
        a { display: inline-block; padding: 11px 18px; border-radius: 4px; background: #f58220; color: #fff; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <img src="{% static 'img/company-logo.png' %}" alt="Сервис-Инжиниринг">
        <div class="code">404</div>
        <h1>Страница не найдена</h1>
        <p>Возможно, ссылка устарела или адрес был указан неверно.</p>
        <a href="/">Вернуться в DocFlow</a>
    </main>
</body>
</html>
